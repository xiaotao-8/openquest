# linGyU — 全新原生 App（Phase 1 起点，FUSION_PLAN.md §6）
#
# 规矩（用户 2026-11-21 定）：从零重写，零复用 native/（openquest-native）
# 任何代码；显示名 linGyU，bundle id cn.lingyu；最低 iOS 26。
# 本目录在 Phase 1 准备阶段只放本文件；Swift 源码由 app coder 写入 linGyU/。
# 生成工程：cd lingyu && xcodegen generate（.xcodeproj 不进仓库，CI 现场生成）。

name: linGyU
options:
  deploymentTarget:
    iOS: "26.0"
packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    exactVersion: 1.5.6
targets:
  linGyU:
    type: application
    platform: iOS
    # Phase 1：只做主 App，不做 widget 扩展（小组件 Phase 3 再定）。
    sources:
      - linGyU
      # Widget / Live Activity 共用源文件（两进程都要编译，见 C 的
      # project-additions.yml；WidgetL10n 只进扩展，不在这里）。
      - path: linGyUWidgets/WidgetSnapshotStore.swift
      - path: linGyUWidgets/WidgetDeepLinks.swift
      - path: linGyUWidgets/LinGyUActivities.swift
      - path: linGyUWidgets/OpenBotIntent.swift
      - path: linGyUWidgets/CallControlIntents.swift
    dependencies:
      - package: Clerk
        product: ClerkKit
      - target: linGyUWidgets
        embed: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: cn.lingyu
      INFOPLIST_FILE: linGyU/Info.plist
      CODE_SIGN_ENTITLEMENTS: linGyU/linGyU.entitlements
      SWIFT_VERSION: "5.9"
      TARGETED_DEVICE_FAMILY: "1,2"
      # 与 Info.plist 里的 NSSupportsLiveActivities=true 同值，双保险：
      # 扩展只注册在主 App 声明支持 Live Activity 时才生效。
      INFOPLIST_KEY_NSSupportsLiveActivities: YES
  linGyUWidgets:
    type: app-extension
    platform: iOS
    sources:
      - linGyUWidgets
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        PRODUCT_NAME: linGyUWidgets
        PRODUCT_BUNDLE_IDENTIFIER: cn.lingyu.LiveActivity
        INFOPLIST_FILE: linGyUWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: linGyUWidgets/linGyUWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        SKIP_INSTALL: YES
