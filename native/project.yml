name: OpenQuest
options:
  bundleIdPrefix: com.xiaotao
  deploymentTarget:
    iOS: "26.0"
targets:
  OpenQuest:
    type: application
    platform: iOS
    # ApprovalActivity.swift 同时编进主 App 和扩展，两边用同一份 LiveActivity 属性定义。
    sources: [OpenQuest, OpenQuestWidget/ApprovalActivity.swift]
    dependencies:
      - target: OpenQuestWidget
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.xiaotao.openquest
      INFOPLIST_FILE: OpenQuest/Info.plist
      SWIFT_VERSION: "5.9"
      TARGETED_DEVICE_FAMILY: "1,2"
  OpenQuestWidget:
    type: app-extension
    platform: iOS
    sources: [OpenQuestWidget]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.xiaotao.openquest.widget
      INFOPLIST_FILE: OpenQuestWidget/Info.plist
      SWIFT_VERSION: "5.9"
      TARGETED_DEVICE_FAMILY: "1,2"
