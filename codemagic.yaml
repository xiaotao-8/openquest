# OpenQuest iOS 构建（Codemagic，无签名 IPA）
#
# 背景：GitHub Actions 的免费 macOS 机器自 2026-11-19 晚起一直排不到
# （arm64 池连续多轮排 15 分钟被取消），按用户决定改走 Codemagic
# （Flutter 专用 CI，自有 Mac 机器池，免费档每月 500 分钟）。
#
# 配方与 .github/workflows/build-ios.yml 完全一致（上游原项目的做法）：
# Flutter 3.47.6、关 SPM、brew 装 meson/ninja/llvm/lld/libarchive、
# 先跑 ios/sandbox/ensure_artifacts.sh、再 flutter build ios --release
# --no-codesign，最后手动打 Payload 结构的未签名 IPA，交给用户的
# SideKite 用个人 Apple ID 重签安装。不需要开发者账号/证书/密钥。

workflows:
  ios-unsigned:
    name: OpenQuest iOS unsigned
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      flutter: 3.47.6
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: 关闭 Swift Package Manager（上游同款设置）
        script: flutter config --no-enable-swift-package-manager
      - name: 拉依赖
        script: flutter pub get
      - name: 准备 iSH 沙箱产物（含 fakefsify 工具）
        script: |
          brew install meson ninja llvm lld libarchive
          ios/sandbox/ensure_artifacts.sh
      - name: 构建 iOS（release、不签名）
        script: flutter build ios --release --no-codesign
      - name: 打包未签名 IPA（Payload 结构）
        script: |
          rm -rf Payload OpenQuest-unsigned.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry OpenQuest-unsigned.ipa Payload
          ls -lh OpenQuest-unsigned.ipa
    artifacts:
      - OpenQuest-unsigned.ipa

  ios-native:
    name: OpenQuest Native iOS (SwiftUI, unsigned + simulator preview)
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      xcode: latest
      groups:
        - app_vars
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: native
          include: true
    scripts:
      - name: 注入服务器令牌（构建时生成，不进仓库）
        script: |
          if [ -n "$OQ_SERVER_TOKEN" ]; then
            printf 'enum BakedServer {\n    static let token = "%s"\n}\n' "$OQ_SERVER_TOKEN" > native/OpenQuest/Secrets.swift
            echo "token injected"
          else
            echo "OQ_SERVER_TOKEN not set, keeping placeholder"
          fi
      - name: 生成 Xcode 工程
        script: |
          brew install xcodegen
          cd native && xcodegen generate
      - name: 模拟器构建并截图（真图验证用）
        script: |
          set -e
          cd native
          SIM_UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for rt,devs in d['devices'].items():
              if 'iOS' not in rt: continue
              for dev in devs:
                  if 'iPhone' in dev['name'] and dev.get('isAvailable', True):
                      print(dev['udid']); raise SystemExit
          ")
          echo "SIM=$SIM_UDID"
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcodebuild build -project OpenQuest.xcodeproj -scheme OpenQuest \
            -destination "id=$SIM_UDID" -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO
          APP=$(find build-sim/Build/Products -name "OpenQuest.app" -maxdepth 3 | head -1)
          xcrun simctl install "$SIM_UDID" "$APP"
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-empty.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-list.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewChat
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-chat.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewSettings
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-settings.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewDNS
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-dns.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewLiveChat
          sleep 25
          xcrun simctl io "$SIM_UDID" screenshot preview-livechat.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewProviders
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-providers.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewCloud
          sleep 12
          xcrun simctl io "$SIM_UDID" screenshot preview-cloud.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewPermissions
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-permissions.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewAsk
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-ask.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewApproval
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-approval.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewLog
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-log.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewPage=agents
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-page-agents.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewPage=skills
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-page-skills.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewPage=plugins
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-page-plugins.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewPage=connectors
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-page-connectors.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewPage=browser
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-page-browser.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewPage=schedules
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-page-schedules.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewPage=miniapps
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-page-miniapps.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewPage=language
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-page-language.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewPage=usage
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-page-usage.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewPage=soul
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-page-soul.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewPage=memory
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-page-memory.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewPage=envvars
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-page-envvars.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewPage=update
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-page-update.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewPage=devicecaps
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-page-devicecaps.png
          ls -lh preview-empty.png preview-list.png preview-chat.png preview-settings.png preview-dns.png preview-livechat.png preview-providers.png preview-cloud.png preview-permissions.png preview-ask.png preview-approval.png preview-log.png preview-page-agents.png preview-page-skills.png preview-page-plugins.png preview-page-connectors.png preview-page-browser.png preview-page-schedules.png preview-page-miniapps.png preview-page-language.png preview-page-usage.png preview-page-soul.png preview-page-memory.png preview-page-envvars.png preview-page-update.png preview-page-devicecaps.png
      - name: 设备版未签名 IPA
        script: |
          set -e
          cd native
          xcodebuild build -project OpenQuest.xcodeproj -scheme OpenQuest \
            -destination "generic/platform=iOS" -configuration Release -derivedDataPath build-dev CODE_SIGNING_ALLOWED=NO
          rm -rf Payload OpenQuestNative-unsigned.ipa
          mkdir -p Payload
          cp -R build-dev/Build/Products/Release-iphoneos/OpenQuest.app Payload/
          zip -qry OpenQuestNative-unsigned.ipa Payload
          ls -lh OpenQuestNative-unsigned.ipa
    artifacts:
      - native/preview-list.png
      - native/preview-empty.png
      - native/preview-chat.png
      - native/preview-settings.png
      - native/preview-dns.png
      - native/preview-livechat.png
      - native/preview-providers.png
      - native/preview-cloud.png
      - native/preview-permissions.png
      - native/preview-ask.png
      - native/preview-approval.png
      - native/preview-log.png
      - native/preview-page-agents.png
      - native/preview-page-skills.png
      - native/preview-page-plugins.png
      - native/preview-page-connectors.png
      - native/preview-page-browser.png
      - native/preview-page-schedules.png
      - native/preview-page-miniapps.png
      - native/preview-page-language.png
      - native/preview-page-usage.png
      - native/preview-page-soul.png
      - native/preview-page-memory.png
      - native/preview-page-envvars.png
      - native/preview-page-update.png
      - native/preview-page-devicecaps.png
      - native/OpenQuestNative-unsigned.ipa
