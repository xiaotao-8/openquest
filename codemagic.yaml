# OpenQuest iOS 构建（Codemagic，无签名 IPA）
#
# 背景：GitHub Actions 的免费 macOS 机器自 2026-11-19 晚起一直排不到
# （arm64 池连续多轮排 15 分钟被取消），按用户决定改走 Codemagic
# （Flutter 专用 CI，自有 Mac 机器池，免费档每月 500 分钟）。
#
# 配方与 .github/workflows/build-ios.yml 完全一致（上游原项目的做法）：
# Flutter 3.47.6、关 SPM、brew 装 meson/ninja/llvm/lld/libarchive、
# 先跑 ios/sandbox/ensure_artifacts.sh、再 flutter build ios --release
# --no-codesign，最后手动打 Payload 结构的未签名 IPA，交给用户的
# SideKite 用个人 Apple ID 重签安装。不需要开发者账号/证书/密钥。

workflows:
  ios-unsigned:
    name: OpenQuest iOS unsigned
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      flutter: 3.47.6
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: 关闭 Swift Package Manager（上游同款设置）
        script: flutter config --no-enable-swift-package-manager
      - name: 拉依赖
        script: flutter pub get
      - name: 准备 iSH 沙箱产物（含 fakefsify 工具）
        script: |
          brew install meson ninja llvm lld libarchive
          ios/sandbox/ensure_artifacts.sh
      - name: 构建 iOS（release、不签名）
        script: flutter build ios --release --no-codesign
      - name: 打包未签名 IPA（Payload 结构）
        script: |
          rm -rf Payload OpenQuest-unsigned.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry OpenQuest-unsigned.ipa Payload
          ls -lh OpenQuest-unsigned.ipa
    artifacts:
      - OpenQuest-unsigned.ipa

  ios-native:
    name: OpenQuest Native iOS (SwiftUI, unsigned + simulator preview)
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      xcode: latest
      groups:
        - app_vars
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: native
          include: true
    scripts:
      - name: 注入服务器令牌（构建时生成，不进仓库）
        script: |
          if [ -n "$OQ_SERVER_TOKEN" ]; then
            printf 'enum BakedServer {\n    static let token = "%s"\n}\n' "$OQ_SERVER_TOKEN" > native/OpenQuest/Secrets.swift
            echo "token injected"
          else
            echo "OQ_SERVER_TOKEN not set, keeping placeholder"
          fi
      - name: 生成 Xcode 工程
        script: |
          brew install xcodegen
          cd native && xcodegen generate
      - name: 模拟器构建并截图（真图验证用）
        script: |
          set -e
          cd native
          SIM_UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for rt,devs in d['devices'].items():
              if 'iOS' not in rt: continue
              for dev in devs:
                  if 'iPhone' in dev['name'] and dev.get('isAvailable', True):
                      print(dev['udid']); raise SystemExit
          ")
          echo "SIM=$SIM_UDID"
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcodebuild build -project OpenQuest.xcodeproj -scheme OpenQuest \
            -destination "id=$SIM_UDID" -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO
          APP=$(find build-sim/Build/Products -name "OpenQuest.app" -maxdepth 3 | head -1)
          xcrun simctl install "$SIM_UDID" "$APP"
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-empty.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-list.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewChat
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-chat.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewSettings
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-settings.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewDNS
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-dns.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewLiveChat
          sleep 25
          xcrun simctl io "$SIM_UDID" screenshot preview-livechat.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewProviders
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-providers.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewPermissions
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-permissions.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewAsk
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-ask.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewApproval
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-approval.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewLog
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-log.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewPage=agents
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-page-agents.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewPage=skills
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-page-skills.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewPage=plugins
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-page-plugins.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewPage=connectors
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-page-connectors.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewPage=browser
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-page-browser.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewPage=schedules
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-page-schedules.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewPage=miniapps
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-page-miniapps.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewPage=language
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-page-language.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewPage=usage
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-page-usage.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewPage=soul
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-page-soul.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewPage=memory
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-page-memory.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewPage=envvars
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-page-envvars.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewPage=update
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-page-update.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewPage=devicecaps
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-page-devicecaps.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewPage=group
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-page-group.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          # 英文 chrome 验收：-PreviewLang=en 临时切英文（不落盘），截首页看标签栏/设置/输入框是否全英文。
          xcrun simctl launch "$SIM_UDID" com.xiaotao.openquest -- -PreviewSeed -PreviewLang=en
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-lang-en.png
          xcrun simctl terminate "$SIM_UDID" com.xiaotao.openquest || true
          ls -lh preview-empty.png preview-list.png preview-chat.png preview-settings.png preview-dns.png preview-livechat.png preview-providers.png preview-permissions.png preview-ask.png preview-approval.png preview-log.png preview-page-agents.png preview-page-skills.png preview-page-plugins.png preview-page-connectors.png preview-page-browser.png preview-page-schedules.png preview-page-miniapps.png preview-page-language.png preview-page-usage.png preview-page-soul.png preview-page-memory.png preview-page-envvars.png preview-page-update.png preview-page-devicecaps.png preview-page-group.png preview-lang-en.png
      - name: 设备版未签名 IPA
        script: |
          set -e
          cd native
          xcodebuild build -project OpenQuest.xcodeproj -scheme OpenQuest \
            -destination "generic/platform=iOS" -configuration Release -derivedDataPath build-dev CODE_SIGNING_ALLOWED=NO
          rm -rf Payload OpenQuestNative-unsigned.ipa
          mkdir -p Payload
          cp -R build-dev/Build/Products/Release-iphoneos/OpenQuest.app Payload/
          zip -qry OpenQuestNative-unsigned.ipa Payload
          ls -lh OpenQuestNative-unsigned.ipa
    artifacts:
      - native/preview-list.png
      - native/preview-empty.png
      - native/preview-chat.png
      - native/preview-settings.png
      - native/preview-dns.png
      - native/preview-livechat.png
      - native/preview-providers.png
      - native/preview-permissions.png
      - native/preview-ask.png
      - native/preview-approval.png
      - native/preview-log.png
      - native/preview-page-agents.png
      - native/preview-page-skills.png
      - native/preview-page-plugins.png
      - native/preview-page-connectors.png
      - native/preview-page-browser.png
      - native/preview-page-schedules.png
      - native/preview-page-miniapps.png
      - native/preview-page-language.png
      - native/preview-page-usage.png
      - native/preview-page-soul.png
      - native/preview-page-memory.png
      - native/preview-page-envvars.png
      - native/preview-page-update.png
      - native/preview-page-devicecaps.png
      - native/preview-page-group.png
      - native/preview-lang-en.png
      - native/OpenQuestNative-unsigned.ipa

  lingyu-native:
    name: linGyU Native iOS (SwiftUI, unsigned + simulator preview)
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      xcode: latest
      groups:
        - app_vars
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: lingyu
          include: true
    scripts:
      - name: 生成 Xcode 工程
        script: |
          brew install xcodegen
          cd lingyu && xcodegen generate
      - name: 模拟器构建并截图（真图验证用）
        script: |
          set -e
          cd lingyu
          SIM_UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for rt,devs in d['devices'].items():
              if 'iOS' not in rt: continue
              for dev in devs:
                  if 'iPhone' in dev['name'] and dev.get('isAvailable', True):
                      print(dev['udid']); raise SystemExit
          ")
          echo "SIM=$SIM_UDID"
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcodebuild build -project linGyU.xcodeproj -scheme linGyU \
            -destination "id=$SIM_UDID" -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO
          APP=$(find build-sim/Build/Products -name "linGyU.app" -maxdepth 3 | head -1)
          xcrun simctl install "$SIM_UDID" "$APP"
          # Index 20: PreviewCall 首次触发麦克风授权框，之后 6 张截图全被
          # 该系统框盖住。预先授权，截图里不再弹框。
          # Index 21 教训：参数顺序写错了——simctl privacy 的设备在前、
          # grant 在后（privacy <device> grant <service> <bundle>），
          # 错写成 privacy grant … 时命令静默失败（被 || true 吞掉），框还在。
          xcrun simctl privacy "$SIM_UDID" grant microphone cn.lingyu
          # Index 22: 麦克风框没了，但通话又弹了语音识别框（SFSpeechRecognizer
          # 是另一个权限）。Index 23 试过授它，simctl 报 Failed to set access、
          # 整步失败——这台 Xcode 的 simctl 授不了语音识别，改回尽力而为；
          # 真正的兜底是把 PreviewCall 移到截图序列最后（见下），只盖住通话一张。
          xcrun simctl privacy "$SIM_UDID" grant speech-recognition cn.lingyu || true
          # DIAG (Build #15/#16: app exits within seconds of every launch,
          # screenshots all home screen). Launch with console attached so a
          # Swift fatal error / dyld failure is captured, then dump the
          # simulator crash report and a liveness check into the log.
          xcrun simctl launch --console "$SIM_UDID" cn.lingyu > lingyu-console.log 2>&1 &
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-empty.png
          echo "--- lingyu console (first 60 lines) ---"
          head -60 lingyu-console.log || true
          echo "--- crash reports ---"
          ls -lt ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -6 || true
          LATEST=$(ls -t ~/Library/Logs/DiagnosticReports/linGyU-*.ips 2>/dev/null | head -1)
          if [ -n "$LATEST" ]; then echo "== $LATEST"; head -100 "$LATEST"; fi
          echo "--- app alive? ---"
          xcrun simctl spawn "$SIM_UDID" launchctl list 2>/dev/null | grep -i lingyu || echo "not running"
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-list.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewChat
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-chat.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewApproval
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-approval.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewAsk
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-ask.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewSettings
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-settings.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewPage=discover
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-page-discover.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewPage=state
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-page-state.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewPairingPage=install
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-pairing-install.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewPairingPage=scan
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-pairing-scan.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewComputers
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-computers.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          # Phase 2 captures: Discover + State with seeded Phase 2 data,
          # and the new Settings/State sheets (Soul / Identity / Audit /
          # Vault / Network / Data controls).
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewPage=discover -PreviewPhase2
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-discover-full.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewPage=state -PreviewPhase2 -PreviewStateLower
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-state-full.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          # Phase 3 routines：State 下半区 + seeded routines 演示数据，验证
          # Upcoming 汇总行显示真数字；再单独开 Upcoming 详情页。
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewPage=state -PreviewPhase2 -PreviewRoutines -PreviewStateLower
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-state-routines.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewPage=state -PreviewPhase2 -PreviewRoutines -PreviewUpcoming
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-upcoming.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewSoul -PreviewPhase2
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-soul.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewIdentity -PreviewPhase2
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-identity.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewAudit -PreviewPhase2
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-audit.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewVault
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-vault.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewNetwork
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-network.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewDataControls
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-data-controls.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          # Phase 3 语音：语音服务页（设置 → 语音服务）。
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewVoice
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-voice.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          # Phase 3 电脑管理新页：扩展页 / host 网络页 / 用量页。
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewExtensions
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-extensions.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          # Phase 4 G：Cordis 面板（扩展页 → 动态插件，诚实空态）。
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewExtensions -PreviewCordis
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-extensions-cordis.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          # Phase 4 G：连接器详情页（版本/来源/兼容性/说明文档/举报行）。
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewExtensions -PreviewConnectorDetail
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-extensions-detail.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewHostNetwork
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-host-network.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewUsage
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-usage.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          # Phase 4 E：候选面板（@ 会话 + 禁用的文件组）与 GenUI 只读渲染。
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewChat -PreviewCandidates
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-candidates.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewChat -PreviewGenUI
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-genui.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          # Phase 4 F：视图卡与学习提案种子（无需 host）。
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewViewCard
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-viewcard.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewLearning
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-learning.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          # Phase 4 H：IM 桥接 / 操控手机 / 导入智能体 / 电脑操作四页。
          # 操控手机在模拟器上一定显示“未安装”（模拟器里没有 iCTRL），是预期状态。
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewIMBridge
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-im-bridge.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewPhoneControl
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-phone-control.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewBotImport
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-bot-import.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewComputerUse
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-computer-use.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          # 真聊截图：对 ECS live host 跑一次真实对话。LINGYU_PREVIEW_PAIRING
          # （preview-pairing.json 的 base64）须事先在 Codemagic 环境变量里配好
          # （未配则跳过这步，不让构建失败）。两张图：60 秒时聊天，150 秒时审批卡。
          # 先探测构建机到 ECS 的连通性（只打长度、不打凭证值），再跑 live；
          # 跑完把 App 沙盒里的 live-diag.log 取出 cat 进日志——live 的诊断
          # 不能再只靠截图猜。
          if [ -n "$LINGYU_PREVIEW_PAIRING" ]; then
            echo "--- live probe: builder -> ECS ---"
            curl -sS -m 10 -o /tmp/ecs-health.json -w "health: http=%{http_code} time=%{time_total}s\n" http://47.238.160.204:19222/health || echo "health: curl FAILED"
            head -c 200 /tmp/ecs-health.json 2>/dev/null || true; echo
            echo "pairing blob length: ${#LINGYU_PREVIEW_PAIRING}"
            xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewPairing "$LINGYU_PREVIEW_PAIRING"
            sleep 60
            xcrun simctl io "$SIM_UDID" screenshot preview-live.png
            sleep 90
            xcrun simctl io "$SIM_UDID" screenshot preview-live-approval.png
            xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
            CONTAINER=$(xcrun simctl get_app_container "$SIM_UDID" cn.lingyu data 2>/dev/null || true)
            if [ -n "$CONTAINER" ] && [ -f "$CONTAINER/Documents/live-diag.log" ]; then
              echo "--- live-diag.log ---"
              cat "$CONTAINER/Documents/live-diag.log"
            else
              echo "live-diag.log NOT FOUND (container: ${CONTAINER:-none})"
            fi
          else
            echo "WARNING: LINGYU_PREVIEW_PAIRING not set, skipping live-chat screenshots"
          fi
          # 通话屏放最后：PreviewCall 会触发语音识别授权框（系统框一旦弹出、
          # 无人点就一直留在屏幕上，会盖住之后所有截图）。Index 20–22 的教训：
          # 麦克风框靠预授权消掉了，语音识别框 simctl 授不了（Index 23 报
          # Failed to set access、整步失败），只能让它最后弹，只盖住通话这一张；
          # 通话顶栏本身 Index 22 已验过是干净的。
          xcrun simctl launch "$SIM_UDID" cn.lingyu -- -PreviewSeed -PreviewChat -PreviewCall
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot preview-call.png
          xcrun simctl terminate "$SIM_UDID" cn.lingyu || true
          ls -lh preview-empty.png preview-list.png preview-chat.png preview-approval.png preview-ask.png preview-settings.png preview-page-discover.png preview-page-state.png preview-pairing-install.png preview-pairing-scan.png preview-computers.png preview-discover-full.png preview-state-full.png preview-state-routines.png preview-upcoming.png preview-soul.png preview-identity.png preview-audit.png preview-vault.png preview-network.png preview-data-controls.png preview-voice.png preview-call.png preview-extensions.png preview-extensions-cordis.png preview-extensions-detail.png preview-host-network.png preview-usage.png preview-candidates.png preview-genui.png preview-viewcard.png preview-learning.png preview-im-bridge.png preview-phone-control.png preview-bot-import.png preview-computer-use.png preview-live.png preview-live-approval.png || true
      - name: 设备版未签名 IPA
        script: |
          set -e
          cd lingyu
          xcodebuild build -project linGyU.xcodeproj -scheme linGyU \
            -destination "generic/platform=iOS" -configuration Release -derivedDataPath build-dev CODE_SIGNING_ALLOWED=NO
          rm -rf Payload linGyU-unsigned.ipa
          mkdir -p Payload
          cp -R build-dev/Build/Products/Release-iphoneos/linGyU.app Payload/
          zip -qry linGyU-unsigned.ipa Payload
          ls -lh linGyU-unsigned.ipa
