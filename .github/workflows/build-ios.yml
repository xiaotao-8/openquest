# OpenQuest iOS 构建（无签名 IPA）
#
# 目的：产出一个未签名的 OpenQuest.ipa，交给用户的 SideKite
# 用其个人 Apple ID 重签后装到 iPhone 上。因此这里故意不做任何签名：
# 不需要 Apple 开发者账号、不需要证书、不需要任何密钥。
#
# 触发方式：
#   1) 推代码到 main 分支自动构建；
#   2) 在 GitHub 仓库页 Actions 标签里手动点 "Run workflow"。
# 产物下载：构建完成后在本工作流运行页底部 Artifacts 里下载 openquest-ios-ipa。

name: build-ios

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ipa:
    # 用 macos-15：macos-latest 在本账号下现解析到新镜像，第 1/4/6 轮均在
    # 分到机器前被取消（第 5 轮实测报错 macos-14-arm64-us-default
    # "is not supported"）；macos-15 是上一代稳定镜像，第 2/3 轮实际跑过。
    runs-on: macos-15
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Flutter 3.47.6（上游原项目发布用的版本）
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: 关闭 Swift Package Manager（上游同款设置）
        run: flutter config --no-enable-swift-package-manager

      - name: 拉依赖
        run: flutter pub get

      - name: 准备 iSH 沙箱产物（含 fakefsify 工具）
        # 说明：Xcode 工程引用了 ios/sandbox/build/fakefsify 这个宿主工具，
        # 须先跑 ensure_artifacts.sh 把它编出来，否则构建会报
        # unknown target 'tools/fakefsify'。上游原项目就是这么做的。
        run: |
          brew install meson ninja llvm lld libarchive
          ios/sandbox/ensure_artifacts.sh

      - name: 构建 iOS（release、不签名）
        # 说明：不用 `flutter build ipa --no-codesign`——它只产出 .xcarchive，
        # 无签名时无法导出 .ipa。改用 build ios 拿到 Runner.app 后手动打包，
        # 这是侧载工具（SideKite 等）最通用的未签名 IPA 形式。
        run: flutter build ios --release --no-codesign

      - name: 打包未签名 IPA（Payload 结构）
        run: |
          rm -rf Payload OpenQuest-unsigned.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry OpenQuest-unsigned.ipa Payload
          ls -lh OpenQuest-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: openquest-ios-ipa
          path: OpenQuest-unsigned.ipa
          if-no-files-found: error

  build-ipa-intel:
    # 备用通道：macos-13 是 Intel 机器池，和 arm64 池分开排队。
    # arm64 池自 2026-11-19 21:54 起连续多轮排 15 分钟分不到机器被取消，
    # 故并行试 Intel 池。风险：macos-13 自带 Xcode 最高 15.2，
    # Flutter 3.47.6 若要求更高版本 Xcode，本 job 会在构建步快速失败，
    # 不影响上面的 arm64 主通道。任一通道先出包即可用。
    runs-on: macos-13
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Flutter 3.47.6（上游原项目发布用的版本）
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: 关闭 Swift Package Manager（上游同款设置）
        run: flutter config --no-enable-swift-package-manager

      - name: 拉依赖
        run: flutter pub get

      - name: 准备 iSH 沙箱产物（含 fakefsify 工具）
        run: |
          brew install meson ninja llvm lld libarchive
          ios/sandbox/ensure_artifacts.sh

      - name: 构建 iOS（release、不签名）
        run: flutter build ios --release --no-codesign

      - name: 打包未签名 IPA（Payload 结构）
        run: |
          rm -rf Payload OpenQuest-unsigned.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry OpenQuest-unsigned.ipa Payload
          ls -lh OpenQuest-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: openquest-ios-ipa-intel
          path: OpenQuest-unsigned.ipa
          if-no-files-found: error
